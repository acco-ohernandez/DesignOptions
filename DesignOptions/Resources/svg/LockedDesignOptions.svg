<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pin & Lock (Cmd_LockedDesignOptions): pins links, grids, scope boxes and levels and moves them
       into the ACCO > LOCKED design option. Pushpin (upper-left, solid {{NEUTRAL}} silhouette: cap,
