       Re-render with scripts/rasterize.mjs; never hardcode hex. -->
  <g transform="translate(12.5 12.5) rotate(-45)">
    <path d="M-3.5 -10 H3.5 V-8 H1.5 V-2.5 H5 V-0.5 H-5 V-2.5 H-1.5 V-8 H-3.5 Z" fill="{{NEUTRAL}}" stroke="{{NEUTRAL}}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M0 -0.5 V4" fill="none" stroke="{{NEUTRAL}}" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <path d="M19.75 18 V15 a3.25 3.25 0 0 1 6.5 0 V18" fill="none" stroke="{{NEUTRAL}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
