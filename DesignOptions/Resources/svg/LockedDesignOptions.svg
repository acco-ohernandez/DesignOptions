<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Locked Design Options (Cmd_LockedDesignOptions): pins links, grids, scope boxes and levels and
       moves them into the ACCO > LOCKED design option. Two stacked option cards = design options
       (rear passive {{PAPER}}, front acted-on {{FILL}}, both {{NEUTRAL}} outlined); a solid {{NEUTRAL}}
       padlock badge on the front card = locked. Tokenized for the prompticon skill (acco-house style).
       Re-render with scripts/rasterize.mjs; never hardcode hex. -->
  <rect x="3.5" y="3.5" width="15" height="17" rx="1.5" fill="{{PAPER}}" stroke="{{NEUTRAL}}" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="10.5" y="9.5" width="18" height="19" rx="1.5" fill="{{FILL}}" stroke="{{NEUTRAL}}" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M16.75 18.5 V16 a2.75 2.75 0 0 1 5.5 0 V18.5" fill="none" stroke="{{NEUTRAL}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="14" y="18.5" width="11" height="8" rx="1.25" fill="{{NEUTRAL}}"/>
</svg>
